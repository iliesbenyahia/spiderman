apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`grafana.{{ .Values.domain }}`)
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`alertmanager.{{ .Values.domain }}`)
      services:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`prometheus.{{ .Values.domain }}`)
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090