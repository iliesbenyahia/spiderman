apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pocketid
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
    - websecure-pub 
  routes:
    - match: "Host(`auth.ibenyahia.fr`)"
      kind: Rule 
      services:
        - name: pocketid
          port: http
  tls:
    secretName: pocketid-tls
