apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: satisfactory-api-tcp
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - satisfactory-api
  routes:
    - match: HostSNI(`*`)
      services:
        - name: satisfactory-server
          port: 8888
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: satisfactory-game-tcp
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - satisfactory-tcp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: satisfactory-server
          port: 7777
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: satisfactory-game-udp
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - satisfactory-udp
  routes:
    - services:
        - name: satisfactory-server
          port: 7777