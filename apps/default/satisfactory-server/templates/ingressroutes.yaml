apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: satisfactory-api-tcp
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - sf-api
  routes:
    - match: Host(`satisfactory.ibenyahia.fr`)
      kind: Rule
      services:
        - name: satisfactory-server
          port: 8888
  tls:
    secretName: satisfactory-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: sf-game-tcp
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - sf-game-tcp
  routes:
    - match: HostSNI(`*`)
      services:
        - name: satisfactory-server
          port: 7777
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: sf-udp
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - sf-udp
  routes:
    - services:
        - name: satisfactory-server
          port: 7777