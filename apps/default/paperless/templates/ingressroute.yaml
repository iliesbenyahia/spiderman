apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: paperless
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`paperless.ibenyahia.fr`)"
      kind: Rule
      services:
        - name: paperless
          port: 8000
  tls:
    secretName: paperless-tls