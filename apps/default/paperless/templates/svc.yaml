apiVersion: v1
kind: Service
metadata:
  name: broker
  namespace: {{ .Release.Namespace}}
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-svc
  namespace: {{ .Release.Namespace}}
spec:
  selector:
    app: paperless
  ports:
    - port: 8000
      targetPort: 8000